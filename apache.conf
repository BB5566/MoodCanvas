<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    # 頁面上的資源網址帶 /public/ 前綴，對應回同一個資料夾，否則會被上層 .htaccess 改寫成無限迴圈（500）
    Alias /public /var/www/html/public
    <Directory /var/www/html/public>
        # 不列出資料夾內容（使用者的生成圖不該被一次看光）
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
