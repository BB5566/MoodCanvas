name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  guest-demo:
    name: PHP 語法檢查 + 訪客示範模式
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2（跟 Dockerfile 一樣）
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, gd, curl, mbstring
          coverage: none

      - name: 所有 PHP 檔語法檢查
        run: find app public config scripts index.php -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: 啟動 php -S
        env:
          APP_URL: http://127.0.0.1:8000
        run: |
          mkdir -p logs data
          php -S 127.0.0.1:8000 -t public > logs/server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -s -o /dev/null http://127.0.0.1:8000/index.php && break
            sleep 0.5
          done

      - name: 訪客檢查（首頁、範例詳情、不能寫入）
        run: |
          BASE=http://127.0.0.1:8000/index.php
          fail() { echo "::error::$1"; cat logs/server.log; exit 1; }

          # 1. 首頁 200，有示範橫幅和範例日記
          code=$(curl -s -o home.html -w '%{http_code}' "$BASE?action=home")
          [ "$code" = "200" ] || fail "首頁回 $code，不是 200"
          grep -q '以下是範例日記，登入後就能寫自己的' home.html || fail "首頁沒有示範橫幅"
          grep -q '早餐店阿姨記得我' home.html || fail "首頁沒有範例日記標題"
          grep -q '需登入才能新增日記' home.html || fail "空白格子的「需登入才能新增日記」不見了"

          # 2. 點範例日記的連結，詳情頁 200 且有內容
          link=$(grep -o 'index.php?action=diary_detail&id=-1&year=[0-9]*&month=[0-9]*' home.html | head -n1)
          [ -n "$link" ] || fail "首頁找不到範例日記的連結"
          code=$(curl -s -o detail.html -w '%{http_code}' "http://127.0.0.1:8000/$link")
          [ "$code" = "200" ] || fail "範例詳情回 $code，不是 200"
          grep -q '阿姨還沒等我開口' detail.html || fail "範例詳情沒有日記內容"
          grep -q 'action=diary_edit' detail.html && fail "範例詳情不該有編輯按鈕"
          grep -q 'regenerate-ai-btn' detail.html && fail "範例詳情不該有重新生成 AI 按鈕"

          # 3. 訪客 GET / POST 新增日記都被導去登入
          for method in GET POST; do
            out=$(curl -s -o create.html -X "$method" -d 'title=x&content=y' -w '%{http_code} %{redirect_url}' "$BASE?action=diary_create")
            echo "$method diary_create -> $out"
            case "$out" in
              302*action=login*) ;;
              *) fail "訪客 $method 新增日記沒有被導去登入（$out）" ;;
            esac
            grep -q 'id="diary-form"' create.html && fail "訪客 $method 拿到了新增表單"
          done

          # 4. 沒有 CSRF 的直接送出會被擋
          curl -s -o store.html -d 'title=x&content=y' "$BASE?action=diary_store"
          grep -q '安全驗證失敗' store.html || fail "沒帶 CSRF 的 diary_store 沒有被擋"

          # 5. 範例日記從頭到尾沒寫進資料庫
          php -r '$db = new PDO("sqlite:data/moodcanvas.sqlite");
            $n = $db->query("SELECT COUNT(*) FROM diaries")->fetchColumn();
            $u = $db->query("SELECT COUNT(*) FROM users")->fetchColumn();
            echo "diaries=$n users=$u\n";
            exit($n == 0 && $u == 0 ? 0 : 1);' || fail "資料庫被寫入了"

          echo "全部通過"

  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        id: owner
        run: echo "value=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.value }}/moodcanvas:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
