name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  guest-demo:
    name: PHP 語法檢查 + 訪客示範模式
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2（跟 Dockerfile 一樣）
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, gd, curl, mbstring
          coverage: none

      - name: 所有 PHP 檔語法檢查
        run: find app public config scripts index.php -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: 啟動 php -S
        env:
          APP_URL: http://127.0.0.1:8000
        run: |
          mkdir -p logs data
          php -S 127.0.0.1:8000 -t public > logs/server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -s -o /dev/null http://127.0.0.1:8000/index.php && break
            sleep 0.5
          done

      - name: 訪客檢查（首頁、範例詳情、試寫一篇、不能刪除）
        run: |
          BASE=http://127.0.0.1:8000/index.php
          fail() { echo "::error::$1"; cat logs/server.log; exit 1; }

          # 1. 首頁 200，有示範橫幅和範例日記
          code=$(curl -s -o home.html -w '%{http_code}' "$BASE?action=home")
          [ "$code" = "200" ] || fail "首頁回 $code，不是 200"
          grep -q '把今天的日記' home.html || fail "首頁沒有主視覺"
          grep -q 'og:image' home.html || fail "沒有分享預覽圖"
          grep -q '早餐店阿姨記得我' home.html || fail "首頁沒有範例日記標題"
          grep -q 'demo/demo-1.jpg' home.html || fail "範例日記沒有圖"
          grep -q 'action=diary_create&date=' home.html || fail "空白格子沒有「+」可以試寫"

          # 2. 點範例日記的連結，詳情頁 200 且有內容
          link=$(grep -o 'index.php?action=diary_detail&id=-1&year=[0-9]*&month=[0-9]*' home.html | head -n1)
          [ -n "$link" ] || fail "首頁找不到範例日記的連結"
          code=$(curl -s -o detail.html -w '%{http_code}' "http://127.0.0.1:8000/$link")
          [ "$code" = "200" ] || fail "範例詳情回 $code，不是 200"
          grep -q '阿姨還沒等我開口' detail.html || fail "範例詳情沒有日記內容"
          grep -q 'action=diary_edit' detail.html && fail "範例詳情不該有編輯按鈕"
          grep -q 'regenerate-ai-btn' detail.html && fail "範例詳情不該有重新生成 AI 按鈕"

          # 3. 訪客打開新增頁拿得到表單（不用登入）
          code=$(curl -s -o create.html -w '%{http_code}' "$BASE?action=diary_create")
          [ "$code" = "200" ] || fail "訪客打開新增頁回 $code"
          grep -q 'id="diary-form"' create.html || fail "訪客拿不到新增表單"

          # 4. 沒有 CSRF 的直接送出會被擋
          curl -s -o store.html -d 'title=x&content=y' "$BASE?action=diary_store"
          grep -q '安全驗證失敗' store.html || fail "沒帶 CSRF 的 diary_store 沒有被擋"

          # 5. 範例日記從頭到尾沒寫進資料庫
          php -r '$db = new PDO("sqlite:data/moodcanvas.sqlite");
            $n = $db->query("SELECT COUNT(*) FROM diaries")->fetchColumn();
            $u = $db->query("SELECT COUNT(*) FROM users")->fetchColumn();
            echo "diaries=$n users=$u\n";
            exit($n == 0 && $u == 0 ? 0 : 1);' || fail "資料庫被寫入了"

          # 6. 訪客真的寫一篇（不跑 AI）：會建臨時帳號、存進去；之後刪除要被擋
          J=cookies.txt
          curl -s -c $J -b $J -o form.html "$BASE?action=diary_create&date=2026-01-05"
          token=$(grep -o 'name="csrf_token" value="[^"]*"' form.html | sed 's/.*value="//;s/"$//')
          [ -n "$token" ] || fail "表單沒有 CSRF token"
          out=$(curl -s -c $J -b $J -o saved.html -w '%{http_code} %{redirect_url}' \
            --data-urlencode "csrf_token=$token" --data-urlencode 'title=CI 試寫' \
            --data-urlencode 'content=今天在 CI 裡寫了一篇日記' --data-urlencode 'mood=😊' \
            --data-urlencode 'diary_date=2026-01-05' "$BASE?action=diary_store")
          echo "guest store -> $out"
          case "$out" in 302*action=diary_detail*) ;; *) fail "訪客送出日記沒有成功（$out）" ;; esac
          id=$(echo "$out" | grep -o 'id=[0-9]*' | head -n1 | cut -d= -f2)
          # 同一天再寫一篇：訪客不該被轉去編輯頁（以前是死路）
          out2=$(curl -s -c $J -b $J -o /dev/null -w '%{http_code} %{redirect_url}' \
            --data-urlencode "csrf_token=$token" --data-urlencode 'title=第二篇' \
            --data-urlencode 'content=同一天的第二篇' --data-urlencode 'mood=😊' \
            --data-urlencode 'diary_date=2026-01-05' "$BASE?action=diary_store")
          echo "guest second store -> $out2"
          case "$out2" in 302*action=diary_detail*) ;; *) fail "訪客同一天第二篇被擋或轉去編輯（$out2）" ;; esac
          curl -s -c $J -b $J -o del.html --data-urlencode "csrf_token=$token" -d "id=$id" "$BASE?action=diary_delete&id=$id"
          grep -q '訪客不能刪除' del.html || fail "訪客刪除沒有被擋"
          php -r '$db = new PDO("sqlite:data/moodcanvas.sqlite");
            $n = $db->query("SELECT COUNT(*) FROM diaries")->fetchColumn();
            $names = $db->query("SELECT username FROM users")->fetchAll(PDO::FETCH_COLUMN);
            $g = count(array_filter($names, fn($u) => str_starts_with($u, "guest_")));
            echo "diaries=$n guests=$g\n";
            exit($n == 2 && $g == 1 ? 0 : 1);' || fail "訪客試寫後資料不對"

          echo "全部通過"

  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        id: owner
        run: echo "value=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.value }}/moodcanvas:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
